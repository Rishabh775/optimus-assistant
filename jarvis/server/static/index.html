<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Soundwave</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icons/icon-192.png">
<style>
  :root{--bg:#0f1115;--panel:#161a21;--panel2:#1d2230;--line:#252b38;
        --text:#e8ecf4;--dim:#8b94a7;--accent:#35d0ba;--accent2:#4aa8ff;
        --rail:270px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font:16px/1.45 system-ui,-apple-system,Roboto,sans-serif;
       background:var(--bg);color:var(--text);overflow:hidden}
  button{font:inherit;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;
         background:var(--accent);color:#06231f;font-weight:600}
  button:active{opacity:.8}
  /* login */
  #login{height:100%;display:flex;flex-direction:column;align-items:center;
         justify-content:center;gap:14px;padding:24px}
  #login h1{margin:0;font-size:26px;letter-spacing:.5px}
  #login p{margin:0;color:var(--dim);font-size:13px;text-align:center}
  #tok{width:100%;max-width:320px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
       background:var(--panel);color:var(--text);font-size:16px;outline:none}
  #tok:focus{border-color:var(--accent)}
  #status{color:var(--dim);font-size:13px;min-height:18px;max-width:320px;text-align:center}
  /* app layout */
  #app{display:none;height:100dvh;flex-direction:row}
  #rail{width:var(--rail);min-width:var(--rail);background:var(--panel);
        border-right:1px solid var(--line);display:flex;flex-direction:column}
  #rail .head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px}
  #rail .head h1{margin:0;font-size:17px;letter-spacing:.4px}
  #rail .head h1 small{color:var(--dim);font-weight:400}
  #newChat{padding:8px 12px;border-radius:10px}
  #slist{flex:1;overflow-y:auto;padding:6px}
  .srow{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:9px;cursor:pointer}
  .srow:hover{background:var(--panel2)}
  .srow.active{background:var(--panel2);outline:1px solid var(--line)}
  .srow .t{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .srow .t small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
  .srow .act{display:flex;gap:2px;opacity:0}
  .srow:hover .act{opacity:1}
  @media (hover: none) {.srow .act{opacity:1}}   /* touch: always reachable */
  .srow .act button{padding:6px 9px;border-radius:6px;font-size:13px;background:transparent;color:var(--dim)}
  .srow .act button:active{background:var(--line)}
  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;
         background:var(--panel);border-bottom:1px solid var(--line)}
  #burger{background:transparent;color:var(--text);font-size:22px;padding:2px 8px;display:none}
  header h1{margin:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header h1 small{color:var(--dim);font-weight:400}
  .dot{width:9px;height:9px;border-radius:50%;background:#5c6474;flex:none}
  .dot.on{background:var(--accent)}
  .dot.busy{background:var(--accent2);animation:pulse 1s infinite alternate}
  @keyframes pulse{from{opacity:.4}to{opacity:1}}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;
       overscroll-behavior:contain}
  #empty{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;
         padding:24px;text-align:center;gap:6px;overflow-y:auto}
  #empty h2{margin:0;font-size:18px;font-weight:600}
  #empty p{margin:0 0 14px;color:var(--dim);font-size:13px}
  #empty .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:480px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:999px;
        background:var(--panel2);border:1px solid var(--line);color:var(--text);
        font-size:13px;font-weight:500}
  .chip span{font-size:15px}
  .chip:active{background:var(--line);opacity:1}
  .msg{max-width:85%;padding:10px 14px;border-radius:14px;word-wrap:break-word}
  .me{align-self:flex-end;background:var(--accent2);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
  .you{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);
       border-bottom-left-radius:4px}
  .you .cursor{display:inline-block;width:8px;height:14px;background:var(--accent);
       animation:pulse .8s infinite alternate;vertical-align:-2px}
  /* markdown content inside assistant replies */
  .you p{margin:.5em 0}.you p:first-child{margin-top:0}.you p:last-child{margin-bottom:0}
  .you h1,.you h2,.you h3,.you h4{margin:.8em 0 .35em;line-height:1.3}
  .you h1{font-size:1.3em}.you h2{font-size:1.18em}.you h3{font-size:1.08em}.you h4{font-size:1em}
  .you ul,.you ol{margin:.4em 0;padding-left:1.5em}
  .you li{margin:.2em 0}
  .you a{color:var(--accent2);text-decoration:underline}
  .you blockquote{border-left:3px solid var(--accent);margin:.6em 0;padding:.05em 0 .05em 1em;color:var(--dim)}
  .you code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em;background:#0d0f13;padding:1px 5px;border-radius:5px}
  .you pre{position:relative;background:#0d0f13;border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;margin:.6em 0}
  .you pre code{background:transparent;padding:0;font-size:.84em;line-height:1.5}
  .you table{border-collapse:collapse;margin:.5em 0}
  .you th,.you td{border:1px solid var(--line);padding:5px 9px}
  .copybtn{position:absolute;top:8px;right:8px;background:var(--panel2);color:var(--dim);
           border:1px solid var(--line);border-radius:6px;font-size:12px;padding:3px 8px;font-weight:500}
  .copybtn:active{color:var(--text)}
  /* syntax highlight theme (tuned to the app palette) */
  .hljs{color:#e8ecf4}
  .hljs-comment,.hljs-quote{color:#6b7280;font-style:italic}
  .hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-doctag,.hljs-meta{color:#4aa8ff}
  .hljs-string,.hljs-regexp,.hljs-addition{color:#7ee787}
  .hljs-number,.hljs-built_in,.hljs-symbol{color:#ffa657}
  .hljs-title,.hljs-section,.hljs-name{color:#35d0ba}
  .hljs-attr,.hljs-attribute,.hljs-variable,.hljs-template-variable{color:#e8ecf4}
  .hljs-type,.hljs-class .hljs-title{color:#ffa657}
  .hljs-bullet,.hljs-deletion,.hljs-link{color:#ff7b72}
  .hljs-emphasis{font-style:italic}.hljs-strong{font-weight:bold}
  .note{align-self:center;color:var(--dim);font-size:12px}
  .typing{align-self:flex-start;color:var(--dim);font-size:13px}
  .confirm{align-self:flex-start;max-width:88%;border:1px solid var(--line);
           padding:12px 14px;border-radius:14px;border-left-width:4px}
  .confirm.high{background:#2a1a1b;border-color:#5b2b2b;border-left-color:#ff6b6b}
  .confirm.medium{background:#282218;border-color:#5b4a2b;border-left-color:#ffa657}
  .confirm.done{opacity:.55}
  .confirm-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .badge{font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
         padding:2px 8px;border-radius:999px}
  .badge.high{background:#4a1b1b;color:#ff8a80}
  .badge.medium{background:#4a3510;color:#ffb74d}
  .confirm-tool{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--dim)}
  .confirm-reason{white-space:pre-wrap;color:var(--text);font-size:14px}
  .confirm-args{margin-top:8px;padding:8px 10px;border-radius:8px;background:#0d0f13;
                border:1px solid var(--line);font-family:ui-monospace,Menlo,Consolas,monospace;
                font-size:12px;color:#e8ecf4;word-break:break-word;white-space:pre-wrap}
  .confirm-row{display:flex;gap:10px;margin-top:12px}
  .confirm-row button{flex:1;padding:11px 0;border-radius:10px;font-size:15px;font-weight:600}
  .confirm-row .deny{background:transparent;border:1px solid var(--line);color:var(--text)}
  .confirm-row .approve{background:var(--accent);color:#06231f}
  .confirm-outcome{font-size:14px;font-weight:600;margin-top:6px}
  .confirm-outcome.ok{color:var(--accent)}
  .confirm-outcome.no{color:#ff6b6b}
  form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
       background:var(--panel);border-top:1px solid var(--line)}
  #msg{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
       background:var(--panel2);color:var(--text);font-size:16px;outline:none}
  #msg:focus{border-color:var(--accent)}
  form button{border-radius:12px}
  #attach{background:transparent;color:var(--text);font-size:19px;padding:8px 6px}
  #mic{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:18px;padding:8px 10px}
  #mic.rec{background:#ff6b6b;border-color:#ff6b6b;color:#fff;animation:pulse 1s infinite alternate}
  #att{display:none;flex-wrap:wrap;gap:6px;padding:8px 12px 0;background:var(--panel)}
  #att.on{display:flex}
  .attchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);
           border:1px solid var(--line);border-radius:999px;padding:5px 10px;
           font-size:12px;max-width:250px}
  .attchip b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .attchip button{background:transparent;color:var(--dim);padding:0 2px;font-size:13px}
  /* reminders sheet (proactive loop) */
  #sheet{position:fixed;inset:0;display:none;align-items:flex-end;
         justify-content:center;z-index:60;background:rgba(0,0,0,.55)}
  #sheet .panel{background:var(--panel);width:100%;max-width:540px;
                border-radius:16px 16px 0 0;border:1px solid var(--line);
                padding:14px;max-height:82dvh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}
  .phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .phead h2{margin:0;font-size:16px}
  .phead button{background:transparent;color:var(--dim);font-size:18px;padding:2px 8px}
  .rrow{display:flex;gap:10px;align-items:baseline;padding:10px 6px;
        border-bottom:1px solid var(--line)}
  .rrow:last-child{border-bottom:0}
  .rrow .rt{font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums;flex:none}
  .rrow .rm{flex:1;font-size:14px;min-width:0;word-break:break-word}
  .rrow .rr{color:var(--dim);font-size:11px}
  .rrow .rc{background:transparent;color:var(--dim);padding:2px 9px;border:0;font-size:15px}
  .rrow .rc:active{color:#ff6b6b}
  .rform{display:flex;gap:8px;margin-top:12px}
  .rform input,.rform select{flex:1;min-width:0;padding:10px;border-radius:10px;
        border:1px solid var(--line);background:var(--panel2);color:var(--text);outline:none}
  .rform input:focus,.rform select:focus{border-color:var(--accent)}
  .rform input.wide{flex:2 1 100%}
  .rform button{border-radius:10px}
  .rhint{color:var(--dim);font-size:11px;margin-top:8px}
  #rail .head{gap:6px}
  .mini{background:transparent;color:var(--text);font-size:17px;padding:8px 9px}
  .mini:active{background:var(--panel2)}
  #shade{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:40}
  @media (max-width:820px){
    #burger{display:inline-block}
    #rail{position:fixed;top:0;bottom:0;left:0;z-index:50;transform:translateX(-100%);transition:transform .2s}
    #rail.open{transform:translateX(0)}
    .msg{max-width:92%}
  }
</style>
</head>
<body>
<section id="login">
  <h1>Soundwave <span style="color:#8b94a7;font-size:14px">(v10)</span></h1>
  <p>Enter the token from your PC</p>
  <input id="tok" type="password" placeholder="auth token" autocomplete="off">
  <button id="go">Connect</button>
  <div id="status"></div>
</section>

<main id="app">
  <aside id="rail">
    <div class="head">
      <h1>Soundwave <small>(v10)</small></h1>
      <div style="display:flex;gap:2px">
        <button class="mini" id="briefBtn" title="Briefing">☀️</button>
        <button class="mini" id="remBtn" title="Reminders">⏰</button>
        <button id="newChat">+ New</button>
      </div>
    </div>
    <div id="slist"></div>
  </aside>
  <div id="shade"></div>
  <section id="main">
    <header>
      <button id="burger">☰</button>
      <span class="dot" id="dot"></span>
      <h1 id="stitle"></h1>
    </header>
    <div id="log"></div>
    <div id="empty"></div>
    <div id="att"></div>
    <form id="bar">
      <button type="button" id="attach" title="Photo or document">📎</button>
      <input id="file" type="file" multiple style="display:none"
             accept="image/*,.pdf,.txt,.md,.csv,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip">
      <input id="msg" placeholder="Message..." autocomplete="off" enterkeyhint="send">
      <button type="button" id="mic" title="Voice note">🎙</button>
      <button>Send</button>
    </form>
  </section>
</main>

<!-- reminders sheet (proactive loop) -->
<div id="sheet">
  <div class="panel">
    <div class="phead"><h2>Reminders</h2><button id="rclose" type="button">✕</button></div>
    <div id="rlist"></div>
    <div class="rform">
      <input id="rmsg" class="wide" placeholder="message (e.g. stand up and stretch)">
      <input id="rat" placeholder="in 20 minutes">
      <select id="rrep">
        <option value=""></option>
        <option value="daily">daily</option>
        <option value="weekly">weekly</option>
      </select>
      <button id="radd" type="button">Add</button>
    </div>
    <div class="rhint">When: "in 20 minutes", "15:30", or ISO "2026-10-25T07:30" · repeats daily/weekly</div>
  </div>
</div>

<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/vendor/highlight.min.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var log = $('#log'), ws = null, busy = false, sid = null, typing = null, streamEl = null;
  var deletedSids = {};            // late replies for deleted chats must be ignored

  // register the service worker (enables install + offline; no-op over HTTP)
  if ('serviceWorker' in navigator && window.isSecureContext) {
    navigator.serviceWorker.register('/static/sw.js').catch(function () {});
  }

  var token = null;
  try { token = localStorage.getItem('sw-token'); } catch (e) {}

  function headers() { return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }; }
  function status(t) { $('#status').textContent = t; }

  function scroll() { log.scrollTop = log.scrollHeight; }
  function add(t, cls) {
    var d = document.createElement('div');
    d.className = cls || 'msg you';
    d.textContent = t;
    log.appendChild(d);
    scroll();
    return d;
  }
  function note(t) { add(t, 'note'); }
  function setDot(s) { $('#dot').className = 'dot' + (s ? ' ' + s : ''); }

  function copyText(text, cb) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;opacity:0;top:0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      if (cb) cb();
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { if (cb) cb(); }, fallback);
    } else {
      fallback();
    }
  }

  function addCopyBtn(pre) {
    if (pre.querySelector('.copybtn')) return;
    var btn = document.createElement('button');
    btn.className = 'copybtn';
    btn.textContent = 'Copy';
    btn.type = 'button';
    btn.onclick = function () {
      copyText(pre.textContent, function () {
        btn.textContent = 'Copied ✓';
        setTimeout(function () { btn.textContent = 'Copy'; }, 1500);
      });
    };
    pre.appendChild(btn);
  }

  function renderMd(el, text) {
    var ok = false;
    if (window.marked && window.DOMPurify) {
      try {
        el.innerHTML = DOMPurify.sanitize(marked.parse(text));
        ok = true;
      } catch (e) { ok = false; }
    }
    if (ok) {
      el.style.whiteSpace = '';
      if (window.hljs) {
        el.querySelectorAll('pre code').forEach(function (code) {
          try { hljs.highlightElement(code); } catch (e) {}
        });
      }
      el.querySelectorAll('pre').forEach(addCopyBtn);
    } else {
      el.textContent = text;
      el.style.whiteSpace = 'pre-wrap';
    }
  }

  function addAssistant(text) {
    var d = document.createElement('div');
    d.className = 'msg you';
    log.appendChild(d);
    renderMd(d, text);
    scroll();
    return d;
  }

  // ---- empty state / suggested prompts ----
  var SUGGESTIONS = [
    { icon: '🌤', label: 'Morning briefing', q: 'Give me my daily briefing' },
    { icon: '⏰', label: 'Remind me to stretch', q: 'Remind me to stand up and stretch in 45 minutes' },
    { icon: '💻', label: "How's my system?", q: "How is my system doing right now?" },
    { icon: '📁', label: 'List workspace files', q: 'List the files in my workspace' },
    { icon: '📅', label: "What's on my calendar?", q: "What's on my calendar today?" },
    { icon: '✉️', label: 'Check unread email', q: 'How many unread emails do I have?' },
    { icon: '🌐', label: 'Browse the web', q: "Open github.com and tell me what's trending" },
    { icon: '⚡', label: 'CPU & memory', q: 'Show my current CPU and memory usage' }
  ];

  function renderSuggestions() {
    var box = $('#empty');
    box.innerHTML = '<h2>What can Soundwave do?</h2><p>Try one of these</p><div class="chips"></div>';
    var chips = box.querySelector('.chips');
    SUGGESTIONS.forEach(function (s) {
      var c = document.createElement('button');
      c.className = 'chip';
      c.type = 'button';
      c.innerHTML = '<span>' + s.icon + '</span>' + esc(s.label);
      c.onclick = function () { send(s.q); };
      chips.appendChild(c);
    });
  }

  function showEmpty() { $('#empty').style.display = 'flex'; $('#log').style.display = 'none'; }
  function hideEmpty() { $('#empty').style.display = 'none'; $('#log').style.display = 'flex'; }

  function esc(s) { return (s || '').replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }); }
  function clock(ts) {
    if (!ts) return '';
    var d = new Date(ts * 1000), n = new Date();
    if (d.toDateString() === n.toDateString()) return d.toTimeString().slice(0, 5);
    return d.toISOString().slice(0, 10);
  }

  // ---- sessions rail ----
  function loadSessions() {
    fetch('/api/sessions', { headers: headers() }).then(function (r) { return r.json(); }).then(function (list) {
      var box = $('#slist');
      box.innerHTML = '';
      list.forEach(function (s) {
        var row = document.createElement('div');
        row.className = 'srow' + (s.id === sid ? ' active' : '');
        row.dataset.id = s.id;
        var title = s.title || 'untitled';
        row.innerHTML = '<span class="t"></span><span class="act"><button data-a="rename">✎</button><button data-a="del">🗑</button></span>';
        row.querySelector('.t').innerHTML = esc(title) + '<small>' + clock(s.updated_at) + ' · ' + esc((s.last || '').slice(0, 36)) + '</small>';
        row.addEventListener('click', function (e) {
          if (e.target.getAttribute('data-a')) return;
          openSession(s.id);
        });
        row.querySelector('[data-a=rename]').addEventListener('click', function () {
          var t = prompt('Rename chat:', title);
          if (t && t.trim()) {
            fetch('/api/sessions/' + s.id, { method: 'PATCH', headers: headers(), body: JSON.stringify({ title: t.trim() }) }).then(loadSessions);
          }
        });
        row.querySelector('[data-a=del]').addEventListener('click', function () {
          var label = title || 'untitled';
          if (!confirm('Delete "' + label + '"? This cannot be undone.')) return;
          fetch('/api/sessions/' + s.id, { method: 'DELETE', headers: headers() })
            .then(function (r) {
              if (!r.ok) throw new Error('http ' + r.status);
              deletedSids[s.id] = true;     // ignore any late reply for it
              if (s.id === sid) {
                sid = null;
                $('#stitle').textContent = '';
                log.innerHTML = '';
                streamEl = null;
                if (typing) { typing.remove(); typing = null; }
                busy = false;
                setDot(ws && ws.readyState === 1 ? 'on' : '');
                showEmpty();
              }
              loadSessions();
            })
            .catch(function (e) { note('delete failed: ' + e.message); });
        });
        box.appendChild(row);
      });
    });
  }

  function rowmark(id) {
    document.querySelectorAll('.srow').forEach(function (r) {
      r.classList.toggle('active', r.dataset.id === id);
    });
  }

  function openSession(id) {
    sid = id;
    busy = false;
    log.innerHTML = '';
    rowmark(id);
    closeRail();
    fetch('/api/sessions/' + id + '/messages', { headers: headers() }).then(function (r) { return r.json(); }).then(function (msgs) {
      msgs.slice(-40).forEach(function (m) {
        if (m.role === 'user') add(m.content, 'msg me');
        else addAssistant(m.content);
      });
      if (msgs.length) hideEmpty(); else showEmpty();
      scroll();
    });
    fetch('/api/sessions', { headers: headers() }).then(function (r) { return r.json(); }).then(function (list) {
      var s = list.find(function (x) { return x.id === id; });
      $('#stitle').textContent = (s && s.title) || 'untitled';
    });
  }

  function closeRail() {
    $('#rail').classList.remove('open');
    $('#shade').style.display = 'none';
  }
  $('#burger').onclick = function () { $('#rail').classList.add('open'); $('#shade').style.display = 'block'; };
  $('#shade').onclick = closeRail;
  $('#newChat').onclick = function () {
    fetch('/api/sessions', { method: 'POST', headers: headers(), body: JSON.stringify({}) }).then(function (r) { return r.json(); }).then(function (s) {
      sid = s.id;
      log.innerHTML = '';
      $('#stitle').textContent = 'untitled';
      rowmark(s.id);
      loadSessions();
      closeRail();
      showEmpty();
    });
  };

  // ---- reminders sheet + one-tap briefing (proactive loop) ----
  var sheet = $('#sheet');
  function openSheet() { sheet.style.display = 'flex'; loadReminders(); }
  function closeSheet() { sheet.style.display = 'none'; }
  $('#remBtn').onclick = function () { closeRail(); openSheet(); };
  $('#rclose').onclick = closeSheet;
  sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); });

  function when(ts) {
    var d = new Date(ts * 1000), n = new Date();
    var t = d.toTimeString().slice(0, 5);
    if (d.toDateString() === n.toDateString()) return t;
    if (d.toDateString() === new Date(n.getTime() + 864e5).toDateString()) return 'tomorrow ' + t;
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + t;
  }

  function replyInSheet(t) {
    var d = document.createElement('div');
    d.className = 'note';
    d.textContent = t;
    $('#rlist').appendChild(d);
  }

  function loadReminders() {
    var list = $('#rlist');
    list.innerHTML = '<div class="note">loading...</div>';
    fetch('/api/reminders', { headers: headers() }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function (rows) {
      list.innerHTML = '';
      if (!rows.length) { list.innerHTML = '<div class="note">nothing pending</div>'; return; }
      rows.forEach(function (row) {
        var d = document.createElement('div');
        d.className = 'rrow';
        d.innerHTML = '<span class="rt"></span><span class="rm"></span>' +
                      '<span class="rr"></span><button class="rc" title="cancel">✕</button>';
        d.querySelector('.rt').textContent = when(row.due_at);
        d.querySelector('.rm').textContent = row.message;
        d.querySelector('.rr').textContent = row.repeat ? '↻ ' + row.repeat : '';
        d.querySelector('.rc').onclick = function () {
          fetch('/api/reminders/' + row.id, { method: 'DELETE', headers: headers() })
            .then(loadReminders).catch(loadReminders);
        };
        list.appendChild(d);
      });
    }).catch(function (e) {
      list.innerHTML = '';
      replyInSheet('failed to load: ' + e.message);
    });
  }

  $('#radd').onclick = function () {
    var m = $('#rmsg').value.trim(), at = $('#rat').value.trim(), rep = $('#rrep').value;
    if (!m || !at) { replyInSheet('message and time are both required'); return; }
    fetch('/api/reminders', { method: 'POST', headers: headers(),
      body: JSON.stringify({ message: m, at: at, repeat: rep }) })
      .then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, j: j }; });
      })
      .then(function (res) {
        if (res.ok) {
          $('#rmsg').value = ''; $('#rat').value = ''; $('#rrep').value = '';
          loadReminders();
        } else {
          replyInSheet((res.j && res.j.detail) || 'failed');
        }
      }).catch(function (e) { replyInSheet('failed: ' + e.message); });
  };

  $('#briefBtn').onclick = function () {
    closeRail(); closeSheet();
    if (busy) { note('still working...'); return; }
    hideEmpty();
    add('Brief me', 'msg me');
    var el = addAssistant('working on it...');
    busy = true; setDot('busy');
    fetch('/api/briefing', { method: 'POST', headers: headers() })
      .then(function (r) {
        if (!r.ok) throw new Error('http ' + r.status);
        return r.json();
      })
      .then(function (res) { renderMd(el, res.text || '(empty briefing)'); scroll(); })
      .catch(function (e) { el.textContent = 'Briefing failed: ' + e.message; })
      .then(function () { busy = false; setDot('on'); loadSessions(); });
  };

  // ---- attachments + voice notes (works in browser and the Android shell) ----
  var atts = [];                 // [{path,name,mime,size}] from /api/upload
  var mediaRec = null, recChunks = [];

  function renderAtts() {
    var box = $('#att');
    box.innerHTML = '';
    box.classList.toggle('on', atts.length > 0);
    atts.forEach(function (a, i) {
      var chip = document.createElement('span');
      chip.className = 'attchip';
      chip.innerHTML = '<b></b><button type="button" title="remove">✕</button>';
      chip.querySelector('b').textContent =
        ((a.mime || '').indexOf('image') === 0 ? '🖼 ' : '📄 ') + a.name;
      chip.querySelector('button').onclick = function () {
        atts.splice(i, 1); renderAtts();
      };
      box.appendChild(chip);
    });
  }

  $('#attach').onclick = function () { $('#file').click(); };
  $('#file').onchange = function () {
    var files = Array.prototype.slice.call($('#file').files || []);
    $('#file').value = '';
    files.forEach(function (f) {
      var fd = new FormData();
      fd.append('file', f, f.name);
      note('uploading ' + f.name + '...');
      fetch('/api/upload', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
        body: fd
      }).then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, j: j }; });
      }).then(function (res) {
        if (!res.ok) throw new Error((res.j && res.j.detail) || 'upload failed');
        atts.push(res.j);
        renderAtts();
        note('attached ' + res.j.name);
      }).catch(function (e) { note('upload failed: ' + e.message); });
    });
  };

  $('#mic').onclick = function () {
    if (mediaRec && mediaRec.state === 'recording') { mediaRec.stop(); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      note('recording not supported in this browser');
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus' : '';
      mediaRec = mime ? new MediaRecorder(stream, { mimeType: mime })
                      : new MediaRecorder(stream);
      recChunks = [];
      mediaRec.ondataavailable = function (e) { if (e.data.size) recChunks.push(e.data); };
      mediaRec.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        $('#mic').classList.remove('rec');
        var blob = new Blob(recChunks, { type: 'audio/webm' });
        if (!blob.size) return;
        note('transcribing voice note...');
        var fd = new FormData();
        fd.append('file', blob, 'voice.webm');
        fetch('/api/transcribe', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token },
          body: fd
        }).then(function (r) {
          return r.json().then(function (j) { return { ok: r.ok, j: j }; });
        }).then(function (res) {
          if (!res.ok) throw new Error((res.j && res.j.detail) || 'transcribe failed');
          $('#msg').value = res.j.text;
          $('#msg').focus();
          note('voice note ready — edit and send');
        }).catch(function (e) { note('voice note failed: ' + e.message); });
      };
      $('#mic').classList.add('rec');
      note('recording... tap the mic again to stop');
      mediaRec.start();
    }).catch(function (e) {
      note('mic unavailable: ' + e.message);
    });
  };
  renderAtts();

  // ---- websocket (self-healing: reconnects, queues sends, resyncs) ----
  var wsRetry = 0, wsTimer = null, heartbeat = null, queued = null, resync = false;

  function connect() {
    if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
    var proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/ws?token=' + encodeURIComponent(token));
    ws.onopen = function () {
      wsRetry = 0;
      setDot('on');
      if (heartbeat) clearInterval(heartbeat);
      heartbeat = setInterval(function () {
        if (ws && ws.readyState === 1) {
          try { ws.send(JSON.stringify({ type: 'ping' })); } catch (e) {}
        }
      }, 25000);
      if (resync) {                 // answer may have completed while reconnecting
        resync = false;
        if (sid) openSession(sid); else loadSessions();
      }
      if (queued) {
        var p = queued; queued = null;
        note('reconnected — sending queued message');
        dispatch(p);
      }
    };
    ws.onclose = function () {
      setDot('');
      if (heartbeat) { clearInterval(heartbeat); heartbeat = null; }
      if (busy) {                   // socket died mid-answer: recover instead of freezing
        busy = false;
        resync = true;
        if (typing) { typing.remove(); typing = null; }
      }
      var delay = Math.min(15000, 1000 * Math.pow(2, wsRetry++));
      clearTimeout(wsTimer);
      wsTimer = setTimeout(connect, delay);
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
    ws.onmessage = function (e) {
      var m = JSON.parse(e.data);
      if (m.type === 'pong' || m.type === 'hello') { setDot('on'); return; }
      if (m.type === 'delta') {
        if (deletedSids[m.sid]) return;
        if (m.sid !== sid) {
          if (sid) return;              // another session's stream -> ignore
          sid = m.sid;                  // brand-new chat: adopt it and stream
          rowmark(sid);
        }
        if (typing) { typing.remove(); typing = null; }
        if (!streamEl) { streamEl = add('', 'msg you'); streamEl.style.whiteSpace = 'pre-wrap'; }
        streamEl.textContent += m.text;
        scroll();
      }
      else if (m.type === 'reply') {
        if (deletedSids[m.sid]) return;
        if (typing) { typing.remove(); typing = null; }
        busy = false;
        setDot('on');
        if (!sid) { sid = m.sid; rowmark(sid); }   // first reply creates it
        if (m.sid === sid) {
          if (streamEl && streamEl.textContent && m.text.indexOf(streamEl.textContent) === 0) {
            renderMd(streamEl, m.text);
          } else {
            if (streamEl) streamEl.remove();
            addAssistant(m.text);
          }
          streamEl = null;
        }
        loadSessions();
      }
      else if (m.type === 'confirm') {
        if (typing) { typing.remove(); typing = null; }
        var risk = riskOf(m.tool, m.mandatory);
        var card = document.createElement('div');
        card.className = 'confirm ' + risk.level;
        card.innerHTML =
          '<div class="confirm-head">' +
            '<span class="badge ' + risk.level + '"></span>' +
            '<span class="confirm-tool"></span>' +
          '</div>' +
          '<div class="confirm-reason"></div>' +
          '<div class="confirm-args"></div>' +
          '<div class="confirm-row">' +
            '<button class="deny">Deny</button>' +
            '<button class="approve">Approve</button>' +
          '</div>';
        card.querySelector('.badge').textContent = risk.label;
        card.querySelector('.confirm-tool').textContent = m.tool;
        card.querySelector('.confirm-reason').textContent = m.reason;
        var summary = summarizeArgs(m.tool, m.args);
        var argsEl = card.querySelector('.confirm-args');
        if (summary) { argsEl.textContent = summary; } else { argsEl.remove(); }
        card.querySelector('.approve').onclick = function () { answer(m.id, true, card); };
        card.querySelector('.deny').onclick = function () { answer(m.id, false, card); };
        log.appendChild(card);
        scroll();
      }
      else if (m.type === 'note') { note(m.text); }
      else if (m.type === 'error') { status('Token rejected.'); }
    };
  }

  // resume/network changes: make sure the socket is alive
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && (!ws || ws.readyState > 1)) connect();
  });
  window.addEventListener('online', function () { connect(); });

  function answer(id, yes, card) {
    ws.send(JSON.stringify({ type: 'confirm', id: id, answer: yes }));
    var row = card.querySelector('.confirm-row');
    if (row) {
      var outcome = document.createElement('div');
      outcome.className = 'confirm-outcome ' + (yes ? 'ok' : 'no');
      outcome.textContent = yes ? '✓ Approved' : '✕ Denied';
      row.parentNode.replaceChild(outcome, row);
    }
    card.classList.add('done');
  }

  function riskOf(tool, mandatory) {
    if (mandatory) return { level: 'high', label: 'High risk' };
    if (tool === 'email_send') return { level: 'medium', label: 'Sends email' };
    if (tool === 'shell_run') return { level: 'medium', label: 'Shell command' };
    if (tool === 'browser_type' || tool === 'browser_press') return { level: 'medium', label: 'Web action' };
    if (tool === 'write_file') return { level: 'medium', label: 'File change' };
    return { level: 'medium', label: 'Approval needed' };
  }

  function summarizeArgs(tool, args) {
    if (!args) return null;
    if (tool === 'shell_run') return args.cmd || null;
    if (tool === 'email_send') {
      var parts = ['To: ' + (args.to || '?')];
      if (args.subject) parts.push('Subject: ' + args.subject);
      return parts.join('\n');
    }
    if (tool === 'write_file') return args.path || null;
    if (tool === 'browser_type') return (args.selector || '?') + ' ← "' + (args.text || '') + '"';
    if (tool === 'browser_press') return 'key: ' + (args.key || '?');
    try { return JSON.stringify(args); } catch (e) { return null; }
  }

  function send(text) {
    hideEmpty();
    var shown = text;
    if (atts.length) {
      shown += (shown ? '\n' : '') +
        atts.map(function (a) { return '📎 ' + a.name; }).join('\n');
    }
    add(shown, 'msg me');
    var p = { type: 'chat', text: text };
    if (sid) p.session_id = sid;
    if (atts.length) { p.attachments = atts.slice(); }
    atts = [];
    renderAtts();
    if (!ws || ws.readyState !== 1) {
      queued = p;             // reconnects automatically, then sends
      note('not connected — reconnecting, your message will send itself');
      connect();
      return;
    }
    dispatch(p);
  }

  function dispatch(p) {
    typing = add('working on it...', 'typing');
    setDot('busy');
    busy = true;
    try {
      ws.send(JSON.stringify(p));
    } catch (e) {
      busy = false;
      if (typing) { typing.remove(); typing = null; }
      queued = p;
      note('send failed — reconnecting');
      connect();
    }
  }

  function openChat() {
    $('#login').style.display = 'none';
    $('#app').style.display = 'flex';
    renderSuggestions();
    showEmpty();
    connect();
    loadSessions();
    $('#bar').addEventListener('submit', function (e) {
      e.preventDefault();
      var v = $('#msg').value.trim();
      if (!v && !atts.length) return;
      if (busy) { note('still working...'); return; }
      $('#msg').value = '';
      send(v);
    });
  }

  function doLogin(tok) {
    status('Connecting...');
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 10000);
    fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: tok }), signal: ctrl.signal
    }).then(function (r) {
      clearTimeout(timer);
      if (!r.ok) throw new Error('token rejected (' + r.status + ')');
      try { localStorage.setItem('sw-token', tok); } catch (e) {}
      token = tok;
      status('');
      openChat();
    }).catch(function (e) {
      clearTimeout(timer);
      status(e.name === 'AbortError'
        ? 'Timed out — phone could not reach the PC over Tailscale.'
        : 'Failed: ' + e.message);
    });
  }

  $('#go').onclick = function () { var t = $('#tok').value.trim(); if (t) doLogin(t); };
  $('#tok').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#go').click(); });
  window.onerror = function (msg) { status('UI error: ' + msg); return false; };
  window.addEventListener('unhandledrejection', function (e) {
    status('UI error: ' + ((e.reason && e.reason.message) || e.reason || '?'));
  });

  if (token) doLogin(token);
})();
</script>
</body>
</html>
